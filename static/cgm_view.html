<!DOCTYPE html>
<html lang="bg">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/static/i18n.js"></script>
<title data-i18n="cgm_view_title">Глюкоза - CGM + Ръчни</title>
<style>
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0;
    padding: 16px;
  }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 16px; }
  .stats {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stat {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 10px 14px;
    flex: 1;
    min-width: 90px;
  }
  .stat .label { font-size: 11px; color: #888; }
  .stat .value { font-size: 22px; font-weight: 600; }
  .minv { color: #4a9eff; }
  .maxv { color: #ff6b4a; }
  .avgv { color: #e0e0e0; }
  #chart-wrap { position: relative; width: 100%; height: 320px; margin-bottom: 16px; }
  button {
    background: #ffe600;
    color: #111;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    margin-right: 8px;
    margin-bottom: 8px;
  }
  select, input[type=datetime-local] {
    background: #1a1a1a;
    color: #e0e0e0;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    margin-right: 8px;
    margin-bottom: 8px;
  }
  .toggles {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .toggle-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1a1a1a;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
  }
  .toggle-item input { width: 16px; height: 16px; }
  .dot-cgm { width: 10px; height: 10px; border-radius: 50%; background: #4a9eff; display: inline-block; }
  .dot-manual { width: 10px; height: 10px; border-radius: 50%; background: #ffb84a; display: inline-block; }
  #status { font-size: 12px; color: #666; margin-top: 8px; }
</style>
</head>
<body>

<h1 data-i18n="cgm_view_heading">Глюкоза - CGM + Ръчни измервания</h1>
<div class="sub" id="range-label" data-i18n="meal_loading">Зареждане...</div>

<div class="stats">
  <div class="stat"><div class="label" data-i18n="report_min">Мин</div><div class="value minv" id="stat-min">-</div></div>
  <div class="stat"><div class="label" data-i18n="report_mean">Средно</div><div class="value avgv" id="stat-avg">-</div></div>
  <div class="stat"><div class="label" data-i18n="report_max">Макс</div><div class="value maxv" id="stat-max">-</div></div>
</div>

<div class="toggles">
  <label class="toggle-item">
    <input type="checkbox" id="showCgm" checked>
    <span class="dot-cgm"></span> CGM (Libre)
  </label>
  <label class="toggle-item">
    <input type="checkbox" id="showManual" checked>
    <span class="dot-manual"></span> <span data-i18n="legend_manual">Ръчни измервания</span>
  </label>
</div>

<div>
  <select id="rangeSelect">
    <option value="12" data-i18n="range_12h">Последни 12 часа</option>
    <option value="24" selected data-i18n="range_24h">Последни 24 часа</option>
    <option value="72" data-i18n="print_preset_3">Последни 3 дни</option>
    <option value="168" data-i18n="report_preset_7">Последни 7 дни</option>
    <option value="whole" data-i18n="range_whole">Целия наличен период</option>
    <option value="custom" data-i18n="range_custom">Избери период...</option>
  </select>
  <button onclick="loadData()" data-i18n="refresh_now">Обнови сега</button>
  <button onclick="changeApiKey()" data-i18n="api_key">API ключ</button>
</div>

<div id="customRange" style="display:none; margin-bottom:12px;">
  <label style="font-size:13px; color:#888; margin-right:6px;" data-i18n="date_from_colon">От:</label>
  <input type="datetime-local" id="dateFrom">
  <label style="font-size:13px; color:#888; margin-right:6px;" data-i18n="date_to_colon">До:</label>
  <input type="datetime-local" id="dateTo">
  <button onclick="loadData()" data-i18n="apply">Приложи</button>
</div>

<div id="chart-wrap">
  <canvas id="chart"></canvas>
</div>

<div id="status">-</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let chart = null;
let allEntries = [];

// Adjust this if the page is served from a different host than the Diabet Logger API
const API_BASE = window.location.origin;
// No secrets in this file. Credentials live only in this browser's localStorage,
// under the same keys the other pages use ('diabet_api_key', 'diabet_token').
let authFailed = false;   // set after a 401 so the 60 s refresh stops until the user fixes the key
let promptedOnce = false; // ask for the key automatically only once per page load

let statusFn = null;   // keeps the status line re-renderable when the language changes
function setStatusText(fn) { statusFn = fn; document.getElementById('status').textContent = fn(); }

function getApiKey() { return localStorage.getItem('diabet_api_key') || ''; }

function authHeaders() {
  const h = {};
  const key = getApiKey();
  const tok = localStorage.getItem('diabet_token') || '';
  if (key) h['x-api-key'] = key;
  if (tok) h['Authorization'] = 'Bearer ' + tok;
  return h;
}

function askApiKey() {
  const k = prompt(t('prompt_api_key_local'), getApiKey());
  if (k === null) return false;
  localStorage.setItem('diabet_api_key', k.trim());
  return true;
}

function changeApiKey() {
  if (askApiKey()) { authFailed = false; loadData(); }
}

function isCgm(entry) {
  return (entry.notes || '').includes('[CGM]');
}

async function loadData() {
  const sel = document.getElementById('rangeSelect').value;
  const customDiv = document.getElementById('customRange');
  let cutoff, upperBound = Date.now();

  if (sel === 'custom') {
    customDiv.style.display = 'block';
    const fromVal = document.getElementById('dateFrom').value;
    const toVal = document.getElementById('dateTo').value;
    if (!fromVal || !toVal) {
      setStatusText(() => t('toast_pick_both_dates'));
      return;
    }
    cutoff = new Date(fromVal).getTime();
    upperBound = new Date(toVal).getTime();
  } else if (sel === 'whole') {
    customDiv.style.display = 'none';
    cutoff = 0;
  } else {
    customDiv.style.display = 'none';
    const hours = parseInt(sel, 10);
    cutoff = Date.now() - hours * 3600 * 1000;
  }

  setStatusText(() => t('meal_loading'));
  try {
    const params = new URLSearchParams({ limit: '20000' });
    if (cutoff > 0) params.set('from', new Date(cutoff).toISOString());
    if (sel === 'custom') params.set('to', new Date(upperBound).toISOString());

    const res = await fetch(`${API_BASE}/api/entries?${params.toString()}`, {
      headers: authHeaders()
    });
    if (res.status === 401) {
      authFailed = true;
      if (!promptedOnce) {
        promptedOnce = true;
        if (askApiKey()) { authFailed = false; return loadData(); }
      }
      throw new Error(t('err_api_key_required'));
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    allEntries = data
      .map(e => ({
        x: new Date(e.time).getTime(),
        y: e.value,
        cgm: isCgm(e)
      }))
      .filter(p => p.x >= cutoff && p.x <= upperBound)
      .sort((a, b) => a.x - b.x);

    render();
    const updatedAt = new Date(), nEntries = allEntries.length;
    setStatusText(() => t('last_updated', { time: updatedAt.toLocaleTimeString(_lang), n: nEntries }));
  } catch (e) {
    setStatusText(() => t('toast_error') + e.message);
  }
}

function render() {
  const showCgm = document.getElementById('showCgm').checked;
  const showManual = document.getElementById('showManual').checked;

  const visible = allEntries.filter(p => (p.cgm && showCgm) || (!p.cgm && showManual));
  if (visible.length === 0) {
    document.getElementById('stat-min').textContent = '-';
    document.getElementById('stat-avg').textContent = '-';
    document.getElementById('stat-max').textContent = '-';
    if (chart) { chart.destroy(); chart = null; }
    return;
  }

  const vals = visible.map(p => p.y);
  document.getElementById('stat-min').textContent = Math.min(...vals);
  document.getElementById('stat-max').textContent = Math.max(...vals);
  document.getElementById('stat-avg').textContent = Math.round((vals.reduce((s,v)=>s+v,0)/vals.length)*10)/10;

  const startLbl = new Date(visible[0].x).toLocaleString(_lang, {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const endLbl = new Date(visible[visible.length-1].x).toLocaleString(_lang, {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  document.getElementById('range-label').textContent = startLbl + ' \u2192 ' + endLbl;

  const cgmPoints = allEntries.filter(p => p.cgm && showCgm);
  const manualPoints = allEntries.filter(p => !p.cgm && showManual);

  const spanMs = visible[visible.length-1].x - visible[0].x;
  const spanDays = spanMs / 86400000;
  const fmtOpts = spanDays > 2
    ? {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}
    : {hour:'2-digit',minute:'2-digit'};

  const ctx = document.getElementById('chart');
  const existing = Chart.getChart(ctx);
  if (existing) existing.destroy();
  chart = null;

  const datasets = [];
  if (cgmPoints.length > 0) {
    datasets.push({
      label: 'CGM (Libre)',
      data: cgmPoints.map(p => ({ x: p.x, y: p.y })),
      borderColor: '#4a9eff',
      backgroundColor: 'rgba(74,158,255,0.08)',
      fill: true,
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.2,
      parsing: false
    });
  }
  if (manualPoints.length > 0) {
    datasets.push({
      label: t('legend_manual'),
      data: manualPoints.map(p => ({ x: p.x, y: p.y })),
      borderColor: '#ffb84a',
      backgroundColor: '#ffb84a',
      showLine: false,
      pointRadius: 5,
      pointStyle: 'circle',
      parsing: false
    });
  }

  chart = new Chart(ctx, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => new Date(items[0].parsed.x).toLocaleString(_lang)
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          grid: { display: false },
          ticks: {
            color: '#888',
            font: { size: 11 },
            callback: function(val) {
              return new Date(val).toLocaleString(_lang, fmtOpts);
            }
          }
        },
        y: {
          min: 2, max: 16,
          grid: { color: '#222' },
          ticks: { color: '#888', font: { size: 11 } }
        }
      }
    }
  });
}

document.getElementById('rangeSelect').addEventListener('change', function() {
  if (this.value === 'custom') {
    document.getElementById('customRange').style.display = 'block';
  } else {
    document.getElementById('customRange').style.display = 'none';
    loadData();
  }
});
document.getElementById('showCgm').addEventListener('change', render);
document.getElementById('showManual').addEventListener('change', render);

document.addEventListener('langchange', () => {
  if (statusFn) setStatusText(statusFn);
  if (allEntries.length) render();
});
i18nReady().then(loadData);
setInterval(() => {
  if (!authFailed && document.getElementById('rangeSelect').value !== 'custom') loadData();
}, 60000);
</script>

</body>
</html>
