services:
  diabet-logger:
    build: .
    container_name: diabet-logger
    restart: unless-stopped
    ports:
      - "8765:8000"
    volumes:
      - ./data:/data
      # P5: static is bind-mounted read-only, so static changes need no rebuild
      # (app.py still does). Deploy static with `rsync -a --delete` INTO this
      # directory — never mv/replace the directory itself: the mount follows the
      # original directory inode and would keep serving the old one.
      - ./static:/app/static:ro
      - ./juggluco_watermark.json:/app/juggluco_watermark.json
    environment:
      # === AUTH (all optional) ===
      # Browser login — set both to enable login screen:
      - DIABET_USERNAME=${DIABET_USERNAME:-}
      - DIABET_PASSWORD=${DIABET_PASSWORD:-}
      # Script/API access:
      - DIABET_API_KEY=${DIABET_API_KEY:-}
      # Optional: pin JWT secret (else auto-generated in /data/.jwt_secret)
      - DIABET_JWT_SECRET=${DIABET_JWT_SECRET:-}
      # Optional: token lifetime, default 30 days
      - DIABET_TOKEN_TTL_DAYS=${DIABET_TOKEN_TTL_DAYS:-30}
      # === LOCALE ===
      # Ползва се само за групиране по календарен ден (daily breakdown,
      # active-day counts). Съхранението остава UTC.
      - DIABET_TZ=${DIABET_TZ:-Europe/Sofia}
      # === STORAGE ===
      - DIABET_DB=/data/diabet.db
      # === CGM SYNC (juggluco_pull.py) ===
      # Internal port is 8000 (see ports mapping above: "8765:8000")
      - DIABET_LOGGER_URL=http://127.0.0.1:8000/api/entries
      # === JUGGLUCO (телефона) - стойностите са в .env, не тук ===
      - JUGGLUCO_HOST=${JUGGLUCO_HOST:-}
      - JUGGLUCO_PORT=${JUGGLUCO_PORT:-17580}
      - JUGGLUCO_API_SECRET=${JUGGLUCO_API_SECRET:-}
